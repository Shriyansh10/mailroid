name: Security audit

# Audits the PRODUCTION dependency graph (pnpm audit --prod) on every PR, on
# every push to main, and weekly — the weekly run is what catches an advisory
# published against a version that has not changed in the lockfile.
#
# POLICY (details and the accepted-risk process: .github/dependency-audit.md):
#   - critical or high  → the job FAILS.
#   - moderate or low   → reported in the job summary, never fails.
# The production baseline was 0 critical / 0 high when this gate was added
# (2026-11-14), so a failure always means something NEW: a new dependency, a
# version change, or a newly published advisory. It is never pre-existing noise.
#
# Reads only pnpm-lock.yaml: no install, no build, no secrets.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Full report (all severities)
        # Informational: never fails the job; the gate is the next step.
        run: |
          {
            echo "## pnpm audit --prod"
            echo '```'
            pnpm audit --prod || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Gate on high and critical
        run: pnpm audit --prod --audit-level high

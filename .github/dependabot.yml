# Dependency update PRs. Policy and triage process: .github/dependency-audit.md
#
# Security updates (Dependabot alerts → PRs) are raised as soon as an advisory
# lands, independent of the weekly schedule below — that is a repository
# setting: Settings → Code security → Dependabot security updates.
version: 2
updates:
  # The pnpm workspace. One entry at the root covers every package.json in
  # pnpm-workspace.yaml and keeps pnpm-lock.yaml consistent.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      # Patch and minor bumps arrive as one reviewable PR a week rather than
      # dozens. Majors stay separate: each needs its own breaking-change review.
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Majors that need a deliberate migration, not a bot PR:
      #   next / react / react-dom — framework; review release notes first
      #   better-auth — shares the user/session/account tables with production
      #   inngest — v4 changes the serve/registration contract
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "better-auth"
        update-types: ["version-update:semver-major"]
      - dependency-name: "inngest"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  # The deploy workflow hands the VPS SSH key to third-party actions, so their
  # versions are worth tracking too.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(ci)"
